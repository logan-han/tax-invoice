<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Tax Invoice Generator</title>
    <meta name="description" content="Free Australian tax invoice generator. Add your ABN, client and line items with GST, preview the invoice live and download it as a PDF. Nothing is stored: the link is your save file." />
    <meta name="theme-color" content="#111827" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Australian Tax Invoice Generator" />
    <meta property="og:description" content="Make an Australian tax invoice with GST in minutes and download it as a PDF. Free, no sign-up, nothing stored." />
    <meta property="og:url" content="https://invoice.han.life/" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- Google Analytics: production hosts only, so local dev and e2e runs stay out of the data -->
    <script>
        if (location.hostname.endsWith('han.life')) {
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            gtag('js', new Date());
            // The query string is the whole invoice, bank details included; send only utm_* params.
            var pageUrl = new URL(location.href);
            pageUrl.hash = '';
            Array.from(pageUrl.searchParams.keys()).forEach(function (key) {
                if (key.indexOf('utm_') !== 0) pageUrl.searchParams.delete(key);
            });
            gtag('config', 'G-CVEBFCXFSW', { page_location: pageUrl.href });
            var ga = document.createElement('script');
            ga.async = true;
            ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-CVEBFCXFSW';
            document.head.appendChild(ga);
        }
    </script>
</head>
<body>
    <noscript>This invoice generator needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
